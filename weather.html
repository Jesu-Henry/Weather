<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JH Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="weather.css">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">⛅</span>
      <div>
        <div class="brand-name">JH Weather</div>
        <div class="brand-sub">by Jesu Henry</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="clock" id="liveClock"></span>
      <button class="unit-toggle" id="unitToggle">°C</button>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-section">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" id="searchInput"
        placeholder="Search any city…" autocomplete="off" spellcheck="false">
      <div class="autocomplete" id="autocomplete"></div>
    </div>
    <button class="locate-btn" id="locateBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
      My Location
    </button>
  </div>

  <!-- LOADING -->
  <div class="state-msg" id="loadingMsg">
    <div class="loader"></div>
    <p>Loading weather…</p>
  </div>

  <!-- ERROR -->
  <div class="state-msg" id="errorMsg"></div>

  <!-- WEATHER CONTENT -->
  <div id="weatherContent">

    <!-- Alert -->
    <div class="alert-banner" id="alertBanner">
      <span>⚠️</span>
      <p id="alertText"></p>
    </div>

    <!-- Current Conditions -->
    <div class="current-section">
      <div class="current-main">
        <div class="current-left">
          <div class="location">
            <h2 id="locName">—</h2>
            <span id="locCountry">—</span>
          </div>
          <div class="temp-row">
            <span class="temp-big" id="tempBig">—</span>
            <span class="temp-unit" id="tempUnitBig">°C</span>
          </div>
          <div class="weather-desc" id="weatherDesc">—</div>
          <div class="feels-like" id="feelsLike">Feels like —°</div>
        </div>
        <div class="current-icon" id="weatherIconBig">🌤</div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat">
          <span class="stat-label">Humidity</span>
          <span class="stat-value" id="humidity">—%</span>
          <div class="stat-bar"><div class="stat-bar-fill" id="humidityBar"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Wind</span>
          <span class="stat-value" id="windSpeed">— km/h</span>
          <div class="stat-bar"><div class="stat-bar-fill" id="windBar"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Visibility</span>
          <span class="stat-value" id="visibility">— km</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pressure</span>
          <span class="stat-value" id="pressure">— hPa</span>
        </div>
        <div class="stat">
          <span class="stat-label">Dew Point</span>
          <span class="stat-value" id="dewPoint">—°</span>
        </div>
        <div class="stat">
          <span class="stat-label">Wind Dir</span>
          <span class="stat-value" id="windDir">—</span>
        </div>
      </div>
    </div>

    <!-- Sun Times -->
    <div class="sun-section">
      <div class="sun-item">
        <span class="sun-icon">🌅</span>
        <span class="sun-label">Sunrise</span>
        <span class="sun-time" id="sunrise">—</span>
      </div>
      <div class="sun-divider"></div>
      <div class="sun-item">
        <span class="sun-icon">🌇</span>
        <span class="sun-label">Sunset</span>
        <span class="sun-time" id="sunset">—</span>
      </div>
    </div>

    <!-- Hourly Forecast -->
    <div class="section-title">Next 24 Hours</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>

    <!-- 7-Day Forecast -->
    <div class="section-title">7-Day Forecast</div>
    <div class="forecast-grid" id="forecastGrid"></div>

  </div><!-- /weatherContent -->

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-status">
      <div class="pulse"></div>
      <span id="lastUpdated">Awaiting data</span>
    </div>
    <span>Open-Meteo API · No key required</span>
  </footer>

</div><!-- /app -->

<script src="weather.js"></script>
</body>
</html>
